<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>MONOLITH</title>
  </head>
  <body>
    <!-- Hidden SVG filter definition for global noise overlay -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
      <defs>
        <filter id="noiseFilter">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.8"
            numOctaves="3"
            stitchTiles="stitch"
          />
        </filter>
      </defs>
    </svg>

    <div id="root">
      <div style="min-height: 100vh; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; letter-spacing: 0.12em; user-select: none;">
        <div style="font-weight: 900; font-size: 1.4rem; letter-spacing: 0.2em; margin-bottom: 10px;">MONOLITH</div>
        <div style="font-size: 0.72rem; opacity: 0.75;">[INITIALIZING MEDIA MATRIX...]</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
