[package]
name = "monolith"
version = "0.1.0"
edition = "2021"
description = "Monolith: Offline-first media streaming desktop application"
authors = ["Monolith Team"]

[lib]
name = "monolith_lib"
path = "src/lib.rs"

[[bin]]
name = "monolith"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
walkdir = "2.5"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
mime_guess = "2.0"
dirs = "6.0"
local-ip-address = "0.6"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
